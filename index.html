<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── HEADER ───────────────────────── -->
  <header>
    <h1>💰 Expense Tracker</h1>
    <button id="darkToggle">🌙</button>
  </header>

  <!-- ── SUMMARY CARDS ────────────────── -->
  <section class="summary">

    <div class="card income-card">
      <p class="card-label">Total Income</p>
      <h2 class="card-amount" id="totalIncome">$0.00</h2>
    </div>

    <div class="card expense-card">
      <p class="card-label">Total Expenses</p>
      <h2 class="card-amount" id="totalExpense">$0.00</h2>
    </div>

    <div class="card balance-card">
      <p class="card-label">Balance</p>
      <h2 class="card-amount" id="totalBalance">$0.00</h2>
    </div>

  </section>

  <!-- ── ADD TRANSACTION FORM ──────────── -->
  <section class="form-section">
    <h2>Add Transaction</h2>

    <div class="form-grid">

      <div class="field">
        <label>Description</label>
        <input type="text" id="description"
               placeholder="e.g. Grocery shopping">
        <div class="error-msg" id="descError">
          Please enter a description
        </div>
      </div>

      <div class="field">
        <label>Amount ($)</label>
        <input type="number" id="amount"
               placeholder="e.g. 50">
        <div class="error-msg" id="amountError">
          Please enter a valid amount
        </div>
      </div>

      <div class="field">
        <label>Category</label>
        <select id="category">
          <option value="food">🍔 Food</option>
          <option value="transport">🚗 Transport</option>
          <option value="shopping">🛍️ Shopping</option>
          <option value="bills">💡 Bills</option>
          <option value="health">💊 Health</option>
          <option value="salary">💼 Salary</option>
          <option value="other">📦 Other</option>
        </select>
      </div>

      <div class="field">
        <label>Type</label>
        <div class="type-btns">
          <button class="type-btn active"
                  id="incomeBtn"    data-type="income">
            ⬆️ Income
          </button>
          <button class="type-btn"
                  id="expenseBtn"   data-type="expense">
            ⬇️ Expense
          </button>
        </div>
      </div>

    </div>

    <button class="add-btn" id="addBtn">
      + Add Transaction
    </button>
  </section>

  <!-- ── FILTERS ───────────────────────── -->
  <section class="transactions-section">
    <div class="transactions-header">
      <h2>Transactions</h2>
      <div class="filters">
        <select id="filterCategory">
          <option value="all">All Categories</option>
          <option value="food">🍔 Food</option>
          <option value="transport">🚗 Transport</option>
          <option value="shopping">🛍️ Shopping</option>
          <option value="bills">💡 Bills</option>
          <option value="health">💊 Health</option>
          <option value="salary">💼 Salary</option>
          <option value="other">📦 Other</option>
        </select>
        <select id="filterType">
          <option value="all">All Types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <button id="clearAllBtn">🗑️ Clear All</button>
      </div>
    </div>

    <!-- Transaction list built by JS -->
    <div id="transactionList"></div>

    <div id="emptyState" class="empty-state">
      <p>No transactions yet!</p>
      <p>Add your first income or expense above ☝️</p>
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
